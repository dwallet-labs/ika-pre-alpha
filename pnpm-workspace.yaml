packages:
  - sdk/core
  - sdk/solana
  - sdk/ika-wasm
  - examples
  - examples/multisig/react

strictPeerDependencies: false
autoInstallPeers: false

# Only esbuild runs a build script. The others are native accelerators that
# the Solana wallet adapter pulls in; each falls back to pure JavaScript or
# ships a prebuilt binary.
allowBuilds:
  '@stellar/stellar-sdk': false
  bigint-buffer: false
  blake-hash: false
  bufferutil: false
  esbuild: true
  protobufjs: false
  sharp: false
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false
