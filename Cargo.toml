[workspace]
resolver = "2"
members = [
    "crates/ika-protocol-program-id",
    "crates/ika-dwallet-pinocchio",
    "crates/ika-dwallet-native",
    "crates/ika-dwallet-anchor",
    "crates/ika-dwallet-litesvm-test",
    "examples/voting/pinocchio",
    "examples/voting/native",
    "examples/voting/anchor",
    "examples/multisig/pinocchio",
    "examples/multisig/native",
    "examples/multisig/anchor",
]

[workspace.package]
version = "0.1.0"
authors = ["dWallet Labs"]
license = "BSD-3-Clause-Clear"
publish = false
edition = "2024"

[workspace.dependencies]
ika-protocol-program-id = { path = "crates/ika-protocol-program-id" }
ika-dwallet-pinocchio = { path = "crates/ika-dwallet-pinocchio" }
ika-dwallet-anchor = { path = "crates/ika-dwallet-anchor" }
ika-dwallet-native = { path = "crates/ika-dwallet-native" }

# Anchor
anchor-lang = "^1.2"

# Pinocchio
pinocchio = { version = "^0.11.2", features = ["cpi", "copy", "account-resize"] }
pinocchio-system = "^0.6.1"

# Solana
solana-address = { version = "^2.6", features = ["curve25519"] }

# Testing
mollusk-svm = { version = "^0.15.1", features = ["inner-instructions"] }
litesvm = "0.16"
solana-account = "^4.3"
solana-instruction = "^3.4"
solana-program-error = "^3.0"
solana-pubkey = "^4.1"
solana-keypair = "^3.1"
solana-signer = "^3.0"
solana-hash = "^4.5"
solana-transaction = { version = "^4.1", features = ["wincode"] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug", "no-log-ix-name"))',
]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
